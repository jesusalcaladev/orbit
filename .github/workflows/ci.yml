name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 18 is intentionally absent: the dev toolchain (Vitest 4) needs
        # ^20 || ^22 || >=24. The core runtime itself targets >= 20.
        node: [20, 22, 24]
    services:
      # The real-Redis integration suite (@orbit/redis) skips locally without
      # REDIS_URI; here the service container makes it actually run.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      REDIS_URI: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (Biome)
        run: pnpm exec biome check .

      - name: Test
        run: pnpm test

  e2e:
    name: e2e (playwright — web demos, ubuntu / node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers only run headless Chromium here; the unit matrix above covers
    # the other platforms. The demo server is started by Playwright itself
    # (playwright.config.ts webServer, port 4381).
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (with system deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: 'Build + browser E2E (12 tests — demos load + live round-trips)'
        run: pnpm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: examples/web/test-results/
          retention-days: 7

  commitlint:
    name: commitlint (PR title + merge commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Local husky hooks do not run on GitHub-UI merges or squash merges, so
    # enforce conventional commits in CI too.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint commit message
        run: pnpm exec commitlint --from HEAD~1 --to HEAD --verbose

  bench:
    name: bench (ubuntu / node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run benchmark suite (B1–B11)
        run: pnpm run bench

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench/results/benchmarks.json
            bench/results/chart.svg
          if-no-files-found: error

      - name: Summarize
        run: |
          echo '## Benchmark (B1–B11) — ubuntu-latest / node 22' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat bench/results/benchmarks.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
