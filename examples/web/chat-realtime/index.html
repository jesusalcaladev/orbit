<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat · realtime — Orbit</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="demo">
      <div class="demo-head">
        <a class="back" href="/">← demos</a>
        <h1>Chat</h1>
        <span class="pill orbit">Orbit WS</span>
        <span class="pill" id="conn-pill">connecting…</span>
      </div>

      <div class="panel">
        <div class="feed" id="feed"></div>
      </div>

      <div class="panel">
        <div class="row">
          <label>
            <span>Your name</span>
            <input id="name" type="text" value="Ada" maxlength="24" />
          </label>
          <div class="row">
            <input id="text" type="text" placeholder="Type a message…" autocomplete="off" />
            <button id="send" class="mint">Send</button>
            <button id="clear" class="ghost" title="Clear the shared room">Clear room</button>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="k">Connection</div>
          <div class="v" id="status">…</div>
        </div>
        <div class="stat">
          <div class="k">Messages</div>
          <div class="v" id="count">0</div>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
