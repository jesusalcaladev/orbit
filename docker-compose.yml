services:
  orbit:
    build:
      context: ./orbit
      target: builder
    ports:
      - "3000:3000"
    environment:
      - ORBIT_CACHE_HEADER=x-orbit-cache
      - ORBIT_CACHE_DEFAULT_TTL=300
      - ORBIT_REDIS_URL=redis://redis:6379
      - ORBIT_KV_BACKEND=redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./examples:/app/examples:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  cloudflare-kv:
    image: cloudflare/kwazi:latest
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
    ports:
      - "8787:8787"

# Redis is intentionally the only local infrastructure service shipped here.
# It is used for the optional cache and distributed rate-limit examples.
